name: groupware

services:
  # PostgreSQL 17.12 + pgvector. 앱은 5432 하나만 사용한다.
  # pg17 태그는 마이너가 바뀌므로 17.12 다이제스트로 고정한다.
  postgres:
    image: pgvector/pgvector:pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
    container_name: groupware-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    configs:
      - source: postgres_init
        target: /docker-entrypoint-initdb.d/01-vector.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - groupware

  # 이미 있는 데이터 볼륨에는 initdb 스크립트가 다시 실행되지 않는다.
  postgres-databases:
    image: pgvector/pgvector:pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
    container_name: groupware-postgres-databases
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: admin
    configs:
      - source: postgres_databases
        target: /sql/databases.sql
    entrypoint: ["psql", "-h", "postgres", "-U", "postgres", "-d", "postgres", "-v", "ON_ERROR_STOP=1", "-f", "/sql/databases.sql"]
    restart: "no"
    networks:
      - groupware

  # Redis
  redis:
    image: redis:8.10.2
    container_name: groupware-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - groupware

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:4.3.7-management
    container_name: groupware-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - groupware

  # Kafka KRaft. 호스트는 localhost:9092, 컨테이너는 kafka:19092.
  kafka:
    image: apache/kafka:4.4.0
    container_name: groupware-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      # CVE-2026-114938 임시 조치. 패치된 JRE가 들어간 apache/kafka 이미지가 나오면 제거한다.
      KAFKA_OPTS: "-XX:-UseBASE64Intrinsics"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - groupware

  # Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.10
    container_name: groupware-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - groupware

  # Kibana
  kibana:
    image: docker.elastic.co/kibana/kibana:9.4.10
    container_name: groupware-kibana
    restart: unless-stopped
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - groupware

  #prometheus
  prometheus:
    image: prom/prometheus:v3.5.3
    container_name: groupware-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - groupware

  #grafana
  grafana:
    image: grafana/grafana:12.0.0
    container_name: groupware-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin

    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - groupware

  # S3 호환 오브젝트 스토리지. 로컬 테스트 전용이며 배포에는 넣지 않는다.
  garage:
    image: dxflrs/garage:v2.5.0
    container_name: groupware-garage
    restart: unless-stopped
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: GK0123456789abcdef01234567
      GARAGE_DEFAULT_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      GARAGE_DEFAULT_BUCKET: groupware-dev
    ports:
      - "3900:3900"
    configs:
      - source: garage_config
        target: /etc/garage.toml
    volumes:
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - groupware

configs:
  postgres_init:
    content: |
      CREATE EXTENSION IF NOT EXISTS vector;
      CREATE DATABASE user_service ENCODING 'UTF8';
  postgres_databases:
    content: |
      SELECT 'CREATE DATABASE user_service ENCODING ''UTF8'''
      WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'user_service')\gexec
  garage_config:
    content: |
      metadata_dir = "/var/lib/garage/meta"
      data_dir = "/var/lib/garage/data"
      db_engine = "sqlite"
      replication_factor = 1
      rpc_bind_addr = "[::]:3901"
      rpc_public_addr = "127.0.0.1:3901"
      rpc_secret = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

      [s3_api]
      s3_region = "garage"
      api_bind_addr = "[::]:3900"
      root_domain = ".s3.garage.localhost"

      [admin]
      api_bind_addr = "[::]:3903"
      admin_token = "groupware-dev-admin"
      metrics_token = "groupware-dev-metrics"
  #prometheus 설정
  prometheus_config:
    content: |
      global:
        scrape_interval: 15s
      scrape_configs:
        - job_name: spring-services
          metrics_path: /actuator/prometheus
          static_configs:
            - targets: ['host.docker.internal:18081']
              labels:
                service: api-gateway
            - targets: ['host.docker.internal:8082']
              labels:
                service: user-service
            - targets: ['host.docker.internal:8761']
              labels:
                service: eureka-server
            - targets: ['host.docker.internal:8888']
              labels:
                service: config-server

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  kafka_data:
  elasticsearch_data:
  grafana_data:
  garage_meta:
  garage_data:

networks:
  groupware:
    driver: bridge