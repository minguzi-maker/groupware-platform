server:
  port: 8081

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              predicates:
                - Path=/user-service/user/**, /user-service/platform/**
              filters:
                - StripPrefix=1
              uri: lb://user-service

management:
  server:
    port: 18081       # API 포트(8081)와 분리. 게이트웨이 라우트에 올리지 않는다
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true

app:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000
      - http://*.localhost:5173

auth:
  access-token-issuer: user-service
  access-token-key-id: es256-2026
  access-token-public: ${JWT_PUBLIC_KEY:-----BEGIN PUBLIC KEY-----MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE7wOxzOM9xtHw9RvbS19kvJeoioQxiI9vA5BfCEUAkO4bzjy+ODGws6oL7Vv6Dv0YXGdwLqmIkrn6RKujHYoH7g==-----END PUBLIC KEY-----}