[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-service"
version = "0.1.0"
description = "HR payroll orchestrator, specialists, and compliance checks"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic-settings>=2.6",
  "langgraph>=1.0",
  "langchain>=0.3",
  "langchain-google-genai>=4.0",
  "mcp>=2.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.28",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
