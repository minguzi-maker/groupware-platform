server:
  port: 8082

spring:
  application:
    name: user-service
  config:
    import: "optional:configserver:http://localhost:8888/"
  cloud:
    config:
      fail-fast: true
  profiles:
    active: dev

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/user_service
    username: postgres
    password: admin
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    generate-ddl: true
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:1}

  # Gmail SMTP. 앱 비밀번호는 환경변수 MAIL_APP_PASSWORD 이며 커밋하지 않는다.
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_APP_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  security:
    oauth2:
      client:
        registration:
          naver:
            client-name: naver
            redirect-uri: http://localhost:8081/user-service/user/oauth2/code/naver
            authorization-grant-type: authorization_code
            scope: name,email
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
          google:
            client-name: google
            redirect-uri: http://localhost:8081/user-service/user/oauth2/code/google
            authorization-grant-type: authorization_code
            scope: openid,profile,email
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

app:
  mail:
    enabled: ${MAIL_ENABLED:false} # false면 가입과 비밀번호 재설정이 실패한다
    from: ${MAIL_USERNAME:} # Gmail은 로그인 계정 주소여야 한다
    from-name: Groupware
    link-base-url: ${USER_WEB_URL:http://localhost:5173}
    reset-token-ttl: 30m
  frontend:
    url: http://localhost:5173
  cookie:
    secure: false
    same-site: Lax
    session-cookie-name: session
    oauth-transaction-name: oauth_tx
    oauth-transaction-max-age: 10m
auth:

  access-token-key-id: es256-2026
  access-token-issuer: user-service
  access-token-refresh-skew: 15s
  access-token-public: ${JWT_SECRET:-----BEGIN PUBLIC KEY-----MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE7wOxzOM9xtHw9RvbS19kvJeoioQxiI9vA5BfCEUAkO4bzjy+ODGws6oL7Vv6Dv0YXGdwLqmIkrn6RKujHYoH7g==-----END PUBLIC KEY-----}
  access-token-private: ${JWT_PRIVATE:-----BEGIN PRIVATE KEY-----MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQglqtT6MHs37oWHt8aA1MYWXR9K0rrTNsyVGMPPiJFGMChRANCAATvA7HM4z3G0fD1G9tLX2S8l6iKhDGIj28DkF8IRQCQ7hvOPL44MbCzqgvtW/oO/RhcZ3AuqYiSufpEq6Mdigfu-----END PRIVATE KEY-----}
  access-token-expiration: 900000ms # 15분
  refresh-token-expiration: 604800000ms # 7일
